name: Dependabot Handling

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  # Untrusted: this installs and builds the bumped dependency itself, which
  # may be a compromised package. No write token or API key is in scope here.
  build:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.build.outcome }}
      update-type: ${{ steps.metadata.outputs.update-type }}
      dependency-names: ${{ steps.metadata.outputs.dependency-names }}
      previous-version: ${{ steps.metadata.outputs.previous-version }}
      new-version: ${{ steps.metadata.outputs.new-version }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - uses: dependabot/fetch-metadata@v2
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        with:
          node-version: '22'

      - name: Try a clean install and build
        id: build
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          npm install
          npm run build --if-present
        continue-on-error: true

  # Trusted, narrow: only calls the merge API, never runs code from the bump.
  automerge:
    needs: build
    if: needs.build.outputs.outcome == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge clean patch/minor update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  # Major bumps or failed builds: GitHub strips repository secrets (including
  # ANTHROPIC_API_KEY) from any workflow run triggered by a Dependabot-opened
  # pull_request, even in private repos, so Claude cannot run here regardless
  # of permissions granted. Flag the PR for manual review instead of silently
  # failing.
  flag-for-review:
    needs: build
    if: needs.build.outputs.outcome != 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment with bump details for manual review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEP: ${{ needs.build.outputs.dependency-names }}
          OLD: ${{ needs.build.outputs.previous-version }}
          NEW: ${{ needs.build.outputs.new-version }}
          UPDATE_TYPE: ${{ needs.build.outputs.update-type }}
        run: |
          gh pr comment "$PR_URL" --body "Automated build check needs manual review: bumping **$DEP** from $OLD to $NEW ($UPDATE_TYPE). A plain \`npm install && npm run build\` did not cleanly succeed, or this is a major version bump. See the [build job log]($RUN_URL) for details, then run it locally to investigate. Merge or close this PR yourself once resolved."
